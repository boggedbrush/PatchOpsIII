[package]
name = "patchopsiii"
version = "1.3.0-beta.4"
description = "PatchOpsIII Tauri desktop application"
edition = "2021"

[lib]
name = "patchopsiii_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }
winreg = "0.55"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
