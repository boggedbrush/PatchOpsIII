[package]
name = "patchopsiii-gpui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
env_logger = "0.11"
gpui = "=0.2.2"
gpui-component = "=0.5.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
