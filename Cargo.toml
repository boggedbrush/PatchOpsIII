[workspace]
resolver = "2"
members = ["crates/patchops-core", "crates/patchops"]
exclude = ["bench"]

[workspace.package]
version = "1.3.4"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
patchops-core = { path = "crates/patchops-core" }
# gpui 0.2.2 = last crates.io release of the "stable" line. Backend features are
# chosen per-target in crates/patchops/Cargo.toml (see GPUI_NOTES.md).
gpui = { version = "0.2.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

# Panic-site gate (CI runs `cargo clippy --locked -p patchops-core -p patchops --all-targets -- -D warnings`).
# The release profile uses panic = "abort", so a panic in non-test code ends the app; see clippy.toml for
# the test-code exemptions. Each member crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
debug = "line-tables-only"
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

# Measured on 4 cores (see crates/patchops/GPUI_NOTES.md / orchestrator report):
#   opt-level=3 fat/cgu1: 12.4 MB, 353 s clean, 118 s incremental
#   opt-level=s fat/cgu1:  9.6 MB, 290 s clean   <- chosen for shipping
#   opt-level=3 thin/cgu16: 16.1 MB, 255 s clean, 64 s incremental  (profile `release-fast`)
# panic = "abort" is deliberate: `panic = "unwind"` measured 15,779,688 B vs 14,064,104 B stripped
# (+1.72 MB, over the 1.5 MB budget). Consequently a panic in an op ends the process; the hook in
# crates/patchops/src/main.rs first appends message + location to the PatchOpsIII log file.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Quicker local release-ish builds: `cargo build --profile release-fast`.
[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
