[package]
name = "patchops-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure application logic for PatchOpsIII (no GUI dependencies)"

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

# Local time (log timestamps) and uname (log payload header). Already in Cargo.lock via gpui.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
