name: Bug report
description: Report a problem with PatchOpsIII
body:
  - type: input
    id: version
    attributes:
      label: PatchOpsIII version
      placeholder: e.g. 1.3.0-beta4
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Include your operating system and version, or SteamOS version on Steam Deck.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: In-app log
      description: Paste the relevant log from PatchOpsIII, if available. Remove any personal information before posting.
      render: text
