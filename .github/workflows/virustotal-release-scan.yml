name: VirusTotal Release Scan

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan-release-assets:
    name: Scan MSI, AppImage, and Debian release assets
    runs-on: ubuntu-latest
    env:
      VT_CLI_LINUX_SHA256: a340bcb2ee98aff6f19bde1de30702ddf106cbbc63b4309f60b33058e7689266
      VT_CLI_VERSION: "1.3.1"
    steps:
      - name: Require VirusTotal API key
        env:
          VTCLI_APIKEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "${VTCLI_APIKEY:-}" ]; then
            echo "VT_API_KEY secret is required." >&2
            exit 1
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.msi' \
            --pattern '*.AppImage' \
            --pattern '*.deb' \
            --pattern '*.sha256' \
            --dir release-assets
          shopt -s nullglob
          msi_assets=(release-assets/*.msi)
          appimage_assets=(release-assets/*.AppImage)
          deb_assets=(release-assets/*.deb)
          if [ "${#msi_assets[@]}" -eq 0 ] || [ "${#appimage_assets[@]}" -eq 0 ] || [ "${#deb_assets[@]}" -eq 0 ]; then
            echo "Expected at least one .msi, .AppImage, and .deb asset for $TAG." >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi
          for asset in "${msi_assets[@]}" "${appimage_assets[@]}" "${deb_assets[@]}"; do
            sidecar="${asset}.sha256"
            if [ ! -f "$sidecar" ]; then
              printf 'Missing checksum sidecar for %s\n' "$(basename "$asset")" >&2
              exit 1
            fi
            hash="$(sha256sum "$asset" | awk '{print $1}')"
            expected_line="$hash  $(basename "$asset")"
            actual_line="$(tr -d '\r' < "$sidecar")"
            if [ "$actual_line" != "$expected_line" ]; then
              printf 'Checksum sidecar mismatch for %s\n' "$(basename "$asset")" >&2
              exit 1
            fi
          done

      - name: Download VirusTotal CLI
        run: |
          curl -fsSL "https://github.com/VirusTotal/vt-cli/releases/download/${VT_CLI_VERSION}/Linux64.zip" -o vt-cli.zip
          printf '%s  vt-cli.zip\n' "$VT_CLI_LINUX_SHA256" | sha256sum -c -
          unzip -q vt-cli.zip
          chmod +x vt

      - name: Scan release assets
        env:
          TAG: ${{ inputs.tag }}
          VTCLI_APIKEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          {
            echo "# VirusTotal release scan"
            echo
            echo "Release tag: \`$TAG\`"
            echo
            echo "| Asset | SHA-256 | VirusTotal |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          found=0
          while IFS= read -r -d '' asset; do
            found=1
            hash="$(sha256sum "$asset" | awk '{print $1}')"
            ./vt scan file "$asset"
            vt_url="https://www.virustotal.com/gui/file/$hash"
            printf '| `%s` | `%s` | [Report](%s) |\n' \
              "$(basename "$asset")" "$hash" "$vt_url" >> "$GITHUB_STEP_SUMMARY"
          done < <(find release-assets -maxdepth 1 -type f \( -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) -print0)

          if [ "$found" -eq 0 ]; then
            echo "No MSI, AppImage, or Debian assets found for $TAG." >&2
            exit 1
          fi
