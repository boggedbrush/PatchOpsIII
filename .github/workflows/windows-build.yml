name: Windows Build

on:
  push:
    branches: [main, Testing, testing]
  pull_request:
    branches: [main, Testing, testing]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and scan
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ""
    secrets:
      VT_API_KEY:
        description: Optional VirusTotal API key used only by the scan job
        required: false
    outputs:
      hash:
        description: SHA-256 hash of the MSI
        value: ${{ jobs.build-windows.outputs.hash }}
      vt_url:
        description: VirusTotal URL for the MSI
        value: ${{ jobs.build-windows.outputs.vt_url }}
      artifact_name:
        description: Name of the uploaded artifact
        value: ${{ jobs.build-windows.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build-windows:
    name: Build MSI
    runs-on: windows-latest
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      vt_url: ${{ steps.hash.outputs.vt_url }}
      artifact_name: PatchOpsIII-windows
    env:
      HASH_PATH: dist\packages\PatchOpsIII.msi.sha256
      MSI_PATH: dist\packages\PatchOpsIII.msi
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Build MSI
        run: bun run dist:win

      - name: Canonicalize MSI
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path 'src-tauri\target\release\bundle\msi' -Filter '*.msi' -File)
          if ($packages.Count -ne 1) {
            Get-ChildItem -Path 'src-tauri\target\release\bundle' -Recurse -File | ForEach-Object { $_.FullName }
            throw "Expected one MSI, found $($packages.Count)"
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $env:MSI_PATH) | Out-Null
          Copy-Item -Path $packages[0].FullName -Destination $env:MSI_PATH

      - name: Verify MSI upgrade from v1.3.0-beta3
        shell: pwsh
        env:
          LEGACY_MSI_URL: https://github.com/boggedbrush/PatchOpsIII/releases/download/v1.3.0-beta3/PatchOpsIII-Beta.msi
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Msi {
            param(
              [Parameter(Mandatory)]
              [ValidateSet('/i', '/x')]
              [string] $Action,

              [Parameter(Mandatory)]
              [string] $Target,

              [Parameter(Mandatory)]
              [string] $LogPath,

              [int[]] $SuccessCodes = @(0, 1641, 3010)
            )

            $arguments = '{0} "{1}" /qn /norestart /L*v "{2}"' -f $Action, $Target, $LogPath
            $process = Start-Process `
              -FilePath "$env:SystemRoot\System32\msiexec.exe" `
              -ArgumentList $arguments `
              -Wait `
              -PassThru

            $exitCode = [int] $process.ExitCode
            if ($SuccessCodes -notcontains $exitCode) {
              if (Test-Path -LiteralPath $LogPath) {
                Write-Host "::group::Tail of $LogPath"
                Get-Content -LiteralPath $LogPath -Tail 100 | Write-Host
                Write-Host '::endgroup::'
              }
              throw "msiexec $Action failed for $Target with exit code $exitCode"
            }
          }

          function Get-PatchOpsRegistration {
            $uninstallPath = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'

            foreach ($registryView in @(
              [Microsoft.Win32.RegistryView]::Registry64,
              [Microsoft.Win32.RegistryView]::Registry32
            )) {
              $baseKey = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
                [Microsoft.Win32.RegistryHive]::LocalMachine,
                $registryView
              )

              try {
                $uninstallKey = $baseKey.OpenSubKey($uninstallPath)
                if ($null -eq $uninstallKey) {
                  continue
                }

                try {
                  foreach ($subKeyName in $uninstallKey.GetSubKeyNames()) {
                    $productKey = $uninstallKey.OpenSubKey($subKeyName)
                    if ($null -eq $productKey) {
                      continue
                    }

                    try {
                      $displayName = [string] $productKey.GetValue('DisplayName', '')
                      if ($displayName -eq 'PatchOpsIII') {
                        [pscustomobject]@{
                          View           = $registryView.ToString()
                          ProductCode    = $subKeyName
                          DisplayVersion = [string] $productKey.GetValue('DisplayVersion', '')
                          InstallLocation = [string] $productKey.GetValue('InstallLocation', '')
                          DisplayIcon     = [string] $productKey.GetValue('DisplayIcon', '')
                        }
                      }
                    } finally {
                      $productKey.Dispose()
                    }
                  }
                } finally {
                  $uninstallKey.Dispose()
                }
              } finally {
                $baseKey.Dispose()
              }
            }
          }

          $oldMsi = Join-Path $env:RUNNER_TEMP 'PatchOpsIII-v1.3.0-beta3.msi'
          $newMsi = (Resolve-Path -LiteralPath $env:MSI_PATH).Path
          $expectedOldHash = 'd6d8443e0e1136ebc2d3f3f7f97661ff0d299fca7c1ab66de894522b8ad67541'
          $expectedNewVersion = (
            Get-Content -LiteralPath 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json
          ).bundle.windows.wix.version

          Invoke-WebRequest -Uri $env:LEGACY_MSI_URL -OutFile $oldMsi

          $actualOldHash = (Get-FileHash -LiteralPath $oldMsi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualOldHash -ne $expectedOldHash) {
            throw "beta3 MSI SHA-256 mismatch: expected $expectedOldHash, found $actualOldHash"
          }

          $oldInstallAttempted = $false
          $newInstallAttempted = $false
          $testFailure = $null
          $cleanupFailures = [System.Collections.Generic.List[string]]::new()

          try {
            $existing = @(Get-PatchOpsRegistration)
            if ($existing.Count -ne 0) {
              throw "Expected a clean runner, found $($existing.Count) PatchOpsIII registration(s)"
            }

            $oldInstallAttempted = $true
            Invoke-Msi `
              -Action '/i' `
              -Target $oldMsi `
              -LogPath (Join-Path $env:RUNNER_TEMP 'patchops-beta3-install.log')

            $legacyRegistrations = @(Get-PatchOpsRegistration)
            if ($legacyRegistrations.Count -ne 1) {
              throw "Expected one beta3 registration, found $($legacyRegistrations.Count)"
            }
            $legacyProductCode = $legacyRegistrations[0].ProductCode

            $newInstallAttempted = $true
            Invoke-Msi `
              -Action '/i' `
              -Target $newMsi `
              -LogPath (Join-Path $env:RUNNER_TEMP 'patchops-upgrade.log')

            $registrations = @(Get-PatchOpsRegistration)
            Write-Host ($registrations | Format-Table -AutoSize | Out-String)

            if ($registrations.Count -ne 1) {
              throw "Expected exactly one PatchOpsIII registration after upgrade, found $($registrations.Count)"
            }
            if ($registrations[0].DisplayVersion -ne $expectedNewVersion) {
              throw "Expected DisplayVersion $expectedNewVersion, found '$($registrations[0].DisplayVersion)'"
            }
            if ($registrations[0].ProductCode -eq $legacyProductCode) {
              throw 'The Tauri MSI did not replace the legacy MSI product registration'
            }

            $registration = $registrations[0]
            $installedCandidates = [System.Collections.Generic.List[string]]::new()
            if ($registration.DisplayIcon) {
              $installedCandidates.Add((($registration.DisplayIcon -split ',')[0]).Trim().Trim('"'))
            }
            if ($registration.InstallLocation) {
              $installedCandidates.Add((Join-Path $registration.InstallLocation 'patchopsiii.exe'))
              $installedCandidates.Add((Join-Path $registration.InstallLocation 'PatchOpsIII.exe'))
            }
            $installedCandidates.Add((Join-Path $env:ProgramFiles 'PatchOpsIII\patchopsiii.exe'))
            if (${env:ProgramFiles(x86)}) {
              $installedCandidates.Add((Join-Path ${env:ProgramFiles(x86)} 'PatchOpsIII\patchopsiii.exe'))
            }

            $installedExe = $installedCandidates |
              Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
              Select-Object -First 1
            if (-not $installedExe) {
              throw "Installed PatchOpsIII executable was not found. Checked: $($installedCandidates -join ', ')"
            }

            $appProcess = $null
            try {
              $appProcess = Start-Process -FilePath $installedExe -PassThru
              $deadline = [DateTime]::UtcNow.AddSeconds(30)
              do {
                Start-Sleep -Milliseconds 250
                $appProcess.Refresh()
              } while (-not $appProcess.HasExited -and $appProcess.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)

              if ($appProcess.HasExited) {
                throw "Installed PatchOpsIII exited before opening a window (exit code $($appProcess.ExitCode))"
              }
              if ($appProcess.MainWindowHandle -eq 0) {
                throw 'Installed PatchOpsIII did not open a native window within 30 seconds'
              }
              if (-not $appProcess.CloseMainWindow()) {
                throw 'Installed PatchOpsIII did not accept a native close request'
              }
              if (-not $appProcess.WaitForExit(10000)) {
                throw 'Installed PatchOpsIII did not close cleanly within 10 seconds'
              }
              if ($appProcess.ExitCode -ne 0) {
                throw "Installed PatchOpsIII exited with code $($appProcess.ExitCode)"
              }
            } finally {
              if ($null -ne $appProcess -and -not $appProcess.HasExited) {
                Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
                $appProcess.WaitForExit(5000) | Out-Null
              }
            }
          } catch {
            $testFailure = $_
          } finally {
            $cleanupTargets = @()
            if ($newInstallAttempted) {
              $cleanupTargets += [pscustomobject]@{
                Msi = $newMsi
                Log = Join-Path $env:RUNNER_TEMP 'patchops-new-uninstall.log'
              }
            }
            if ($oldInstallAttempted) {
              $cleanupTargets += [pscustomobject]@{
                Msi = $oldMsi
                Log = Join-Path $env:RUNNER_TEMP 'patchops-beta3-uninstall.log'
              }
            }

            foreach ($cleanupTarget in $cleanupTargets) {
              try {
                Invoke-Msi `
                  -Action '/x' `
                  -Target $cleanupTarget.Msi `
                  -LogPath $cleanupTarget.Log `
                  -SuccessCodes @(0, 1605, 1614, 1641, 3010)
              } catch {
                $cleanupFailures.Add($_.Exception.Message) | Out-Null
              }
            }

            if ($oldInstallAttempted) {
              try {
                $remaining = @(Get-PatchOpsRegistration)
                if ($remaining.Count -ne 0) {
                  $cleanupFailures.Add("Cleanup left $($remaining.Count) registration(s)") | Out-Null
                }
              } catch {
                $cleanupFailures.Add("Could not verify cleanup: $($_.Exception.Message)") | Out-Null
              }
            }
          }

          if ($null -ne $testFailure) {
            if ($cleanupFailures.Count -gt 0) {
              Write-Warning ("Cleanup also failed: " + ($cleanupFailures -join '; '))
            }
            throw $testFailure
          }
          if ($cleanupFailures.Count -gt 0) {
            throw "Upgrade succeeded, but cleanup failed: $($cleanupFailures -join '; ')"
          }

      - name: Compute MSI hash
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path $env:MSI_PATH).Hash.ToLowerInvariant()
          "$hash  PatchOpsIII.msi" | Set-Content -Path $env:HASH_PATH -Encoding ascii
          Add-Content -Path $env:GITHUB_OUTPUT -Value "hash=$hash"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "vt_url=https://www.virustotal.com/gui/file/$hash"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PatchOpsIII-windows
          path: |
            dist/packages/PatchOpsIII.msi
            dist/packages/PatchOpsIII.msi.sha256
          if-no-files-found: error

  virus-total:
    name: Scan MSI
    needs: build-windows
    uses: ./.github/workflows/virustotal.yml
    with:
      artifact_name: ${{ needs.build-windows.outputs.artifact_name }}
      file_name: PatchOpsIII.msi
      expected_hash: ${{ needs.build-windows.outputs.hash }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
