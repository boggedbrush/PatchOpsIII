name: Windows Build

on:
  push:
    branches:
      - Testing
      - testing
  pull_request:
    branches:
      - Testing
      - testing
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and scan
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ''
    outputs:
      hash:
        description: SHA256 hash of the Windows MSI
        value: ${{ jobs.build-windows.outputs.hash }}
      vt_url:
        description: VirusTotal URL for the Windows MSI
        value: ${{ jobs.build-windows.outputs.vt_url }}
      artifact_name:
        description: Name of the produced artifact
        value: ${{ jobs.build-windows.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    outputs:
      hash: ${{ steps.compute_hash.outputs.hash }}
      vt_url: ${{ steps.compute_hash.outputs.vt_url }}
      artifact_name: PatchOpsIII-windows
    defaults:
      run:
        shell: pwsh
        working-directory: .
    env:
      RUST_TOOLCHAIN: "1.97.0"
      WIX_VERSION: "5.0.2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      WINDOWS_PACKAGE: dist\packages\PatchOpsIII.msi
      WINDOWS_FALLBACK_PACKAGE: dist\packages\PatchOpsIII.exe
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      VT_CLI_ARCHIVE: vt-cli-latest.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
      - name: Install Rust toolchain (MSVC)
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy
          rustup default $env:RUST_TOOLCHAIN
          rustc --version --verbose
      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry\index
            ~\.cargo\registry\cache
            ~\.cargo\git\db
            target
          key: windows-cargo-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-cargo-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Locate fxc.exe (needed by gpui to compile its HLSL shaders)
        run: |
          # gpui's build script honours GPUI_FXC_PATH, then PATH, then one hard-coded SDK version.
          # Pick the newest x64 fxc.exe from the installed Windows 10/11 SDKs instead.
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $fxc = Get-ChildItem -Path $kits -Filter fxc.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
            Sort-Object { [version]($_.FullName -replace '^.*\\bin\\(\d+\.\d+\.\d+\.\d+)\\.*$', '$1') } -Descending |
            Select-Object -First 1
          if (-not $fxc) {
            Get-ChildItem -Path $kits -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            throw 'fxc.exe not found in the Windows SDK; install the Windows 10/11 SDK'
          }
          Write-Host "Using $($fxc.FullName)"
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Core unit tests
        run: cargo test --locked -p patchops-core
      - name: Clippy
        run: cargo clippy --locked -p patchops-core -p patchops --all-targets -- -D warnings
      - name: Build release binary
        run: |
          cargo build --release --locked -p patchops
          if (-not (Test-Path target\release\patchops.exe)) { throw 'target\release\patchops.exe was not produced' }
      - name: Smoke test console handling of the GUI-subsystem binary
        run: |
          # The release exe has no console of its own (windows_subsystem = "windows"); `--version` and
          # `--rpc-stdio` must still work through redirected pipes, which is how hosts/tests use them.
          $out = Join-Path $env:RUNNER_TEMP 'version.txt'
          Start-Process -FilePath target\release\patchops.exe -ArgumentList '--version' -Wait -NoNewWindow -RedirectStandardOutput $out
          $text = (Get-Content -Raw $out).Trim()
          Write-Host "patchops --version -> '$text'"
          if ($text -notmatch '^patchops \d+\.\d+\.\d+') { throw "unexpected --version output: '$text'" }
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows MSI and portable EXE
        run: ./packaging/windows/package.ps1 -WixUiVersion $env:WIX_VERSION
      - name: Ensure MSI exists
        run: |
          if (-not (Test-Path $env:WINDOWS_PACKAGE)) {
            Get-ChildItem -Recurse dist | ForEach-Object { $_.FullName }
            throw "$env:WINDOWS_PACKAGE was not produced"
          }
      - name: Ensure portable EXE exists
        run: |
          if (-not (Test-Path $env:WINDOWS_FALLBACK_PACKAGE)) {
            Get-ChildItem -Recurse dist | ForEach-Object { $_.FullName }
            throw "$env:WINDOWS_FALLBACK_PACKAGE was not produced"
          }
      - name: Test MSI install, same-version upgrade and uninstall
        run: |
          $msi = (Resolve-Path $env:WINDOWS_PACKAGE).Path
          $installed = Join-Path $env:ProgramFiles 'PatchOpsIII\PatchOpsIII.exe'
          function Run-Msi([string[]]$msiArgs, [string]$log) {
            $p = Start-Process msiexec.exe -ArgumentList ($msiArgs + @('/qn', '/norestart', '/l*v', "`"$log`"")) -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "msiexec $($msiArgs -join ' ') failed with $($p.ExitCode)" }
          }
          Run-Msi @('/i', "`"$msi`"") (Join-Path $env:RUNNER_TEMP 'msi-install.log')
          if (-not (Test-Path $installed)) { throw "$installed missing after install" }
          Run-Msi @('/i', "`"$msi`"") (Join-Path $env:RUNNER_TEMP 'msi-upgrade.log')
          if (-not (Test-Path $installed)) { throw "$installed missing after same-version upgrade" }
          Run-Msi @('/x', "`"$msi`"") (Join-Path $env:RUNNER_TEMP 'msi-uninstall.log')
          if (Test-Path $installed) { throw "$installed still present after uninstall" }
      - name: Compute Windows hash
        id: compute_hash
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path $env:WINDOWS_PACKAGE).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path (Split-Path $env:WINDOWS_PACKAGE) 'hash.log') -Value $hash
          $vtUrl = "https://www.virustotal.com/gui/file/$hash"
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "vt_url=$vtUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Determine VirusTotal CLI release
        id: vt_release
        if: ${{ env.VT_API_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $release = Invoke-RestMethod -Uri https://api.github.com/repos/VirusTotal/vt-cli/releases/latest -Headers $headers
          $tag = $release.tag_name
          if (-not $tag) {
            throw 'Release tag missing from VirusTotal CLI metadata'
          }
          $asset = $release.assets | Where-Object { $_.name -eq 'Windows64.zip' } | Select-Object -First 1
          if (-not $asset) {
            throw 'Windows64.zip asset not found in VirusTotal CLI release metadata'
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "url=$($asset.browser_download_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache VirusTotal CLI
        id: cache-vt
        if: ${{ env.VT_API_KEY != '' }}
        uses: actions/cache@v4
        with:
          path: |
            vt.exe
            ${{ env.VT_CLI_ARCHIVE }}
          key: vt-${{ runner.os }}-${{ steps.vt_release.outputs.tag }}
      - name: Download VirusTotal CLI
        if: ${{ env.VT_API_KEY != '' && steps.cache-vt.outputs.cache-hit != 'true' }}
        run: |
          Invoke-WebRequest -Uri '${{ steps.vt_release.outputs.url }}' -OutFile $env:VT_CLI_ARCHIVE
          Expand-Archive -Path $env:VT_CLI_ARCHIVE -DestinationPath . -Force
      - name: Ensure VirusTotal CLI executable
        if: ${{ env.VT_API_KEY != '' }}
        run: |
          if (-not (Test-Path 'vt.exe')) {
            throw 'VirusTotal CLI binary vt.exe not found'
          }
      - name: VirusTotal scan
        if: ${{ env.VT_API_KEY != '' }}
        run: |
          .\vt.exe scan file $env:WINDOWS_PACKAGE --apikey $env:VT_API_KEY
          .\vt.exe scan file $env:WINDOWS_FALLBACK_PACKAGE --apikey $env:VT_API_KEY
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatchOpsIII-windows
          path: |
            dist/packages/PatchOpsIII.msi
            dist/packages/PatchOpsIII.exe
            dist/packages/hash.log
          if-no-files-found: error
