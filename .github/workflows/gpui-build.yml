name: PatchOpsIII Native Build

on:
  pull_request:
    paths:
      - 'native/gpui/**'
      - 'scripts/*gpui*.py'
      - 'scripts/measure_desktop.py'
      - 'backend/**'
      - '*.py'
      - 'requirements.txt'
      - 'presets.json'
      - 'package.json'
      - 'docs/gpui-architecture.md'
      - '.github/workflows/gpui-build.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.os }} archive
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            executable: native/gpui/target/release/patchopsiii-gpui
            backend: dist/backend/patchops-backend
            archive: dist/native/PatchOpsIII-native-linux-x64.zip
            artifact: PatchOpsIII-native-Linux
          - os: windows-2022
            executable: native/gpui/target/release/patchopsiii-gpui.exe
            backend: dist/backend/patchops-backend.exe
            archive: dist/native/PatchOpsIII-native-windows-x64.zip
            artifact: PatchOpsIII-native-Windows
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: '3.12'
      PYINSTALLER_VERSION: '6.20.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/gpui
      - name: Linux native and packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libasound2-dev libclang-dev mesa-vulkan-drivers xvfb xauth openbox xcompmgr xdotool
      - name: Install Python backend dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}
      - name: Install Python backend dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -U pip
          .\.venv\Scripts\python -m pip install -r requirements.txt
          .\.venv\Scripts\python -m pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}
      - name: Python lifecycle and packaging tests
        run: python -m unittest scripts/test_gpui.py
      - name: Format
        run: cargo fmt --manifest-path native/gpui/Cargo.toml --check
      - name: Lint
        run: cargo clippy --locked --manifest-path native/gpui/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: python scripts/gpui.py test
      - name: Build native release
        run: python scripts/gpui.py build --release
      - name: Build bundled backend (Linux)
        if: runner.os == 'Linux'
        run: bun run build:backend:linux
      - name: Build bundled backend (Windows)
        if: runner.os == 'Windows'
        run: bun run build:backend:win
      - name: Create self-contained native archive
        run: python scripts/package_gpui.py --executable ${{ matrix.executable }} --backend ${{ matrix.backend }} --output ${{ matrix.archive }}
      - name: Smoke test the self-contained Linux archive
        if: runner.os == 'Linux'
        run: |
          python -m zipfile -e ${{ matrix.archive }} "${RUNNER_TEMP}/patchops-native"
          chmod +x "${RUNNER_TEMP}/patchops-native/PatchOpsIII/patchopsiii-gpui"
          chmod +x "${RUNNER_TEMP}/patchops-native/PatchOpsIII/resources/backend-bin/patchops-backend"
          xvfb-run -a python scripts/smoke_gpui_linux.py --start-session --use-owned-backend --executable "${RUNNER_TEMP}/patchops-native/PatchOpsIII/patchopsiii-gpui"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
