name: Release Beta

on:
  workflow_dispatch:
    inputs:
      release_notes_file:
        description: File under Release Notes; latest selects the package version
        required: false
        type: string
        default: latest
      source_ref:
        description: Source branch or tag
        required: true
        type: string
        default: main
      create_tag:
        description: Create the version tag if it does not exist
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      channel: beta
      release_notes_file: ${{ inputs.release_notes_file }}
      source_ref: ${{ inputs.source_ref }}
      create_tag: ${{ inputs.create_tag }}
    secrets: inherit
