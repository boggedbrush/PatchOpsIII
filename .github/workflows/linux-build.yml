name: Linux Build

on:
  push:
    branches:
      - Testing
      - testing
  pull_request:
    branches:
      - Testing
      - testing
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and scan
        required: false
        type: string
        default: ''
      update_information:
        description: AppImageUpdate metadata to embed in the AppImage
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ''
      update_information:
        description: AppImageUpdate metadata to embed in the AppImage
        required: false
        type: string
        default: ''
    outputs:
      hash:
        description: SHA256 hash of the AppImage
        value: ${{ jobs.build-linux.outputs.hash }}
      vt_url:
        description: VirusTotal URL for the AppImage
        value: ${{ jobs.build-linux.outputs.vt_url }}
      artifact_name:
        description: Name of the produced artifact
        value: ${{ jobs.build-linux.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux AppImage
    # Oldest hosted Ubuntu image still supported by GitHub: the binary links against this image's
    # glibc, which is the minimum glibc of the AppImage (2.35). Do not move this forward casually.
    runs-on: ubuntu-22.04
    outputs:
      hash: ${{ steps.compute_hash.outputs.hash }}
      vt_url: ${{ steps.compute_hash.outputs.vt_url }}
      artifact_name: PatchOpsIII-linux
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      RUST_TOOLCHAIN: "1.97.0"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      APPIMAGE_PATH: dist/packages/PatchOpsIII.AppImage
      ZSYNC_PATH: dist/packages/PatchOpsIII.AppImage.zsync
      MAX_GLIBC: "2.35"
      UPDATE_INFORMATION: ${{ inputs.update_information || (github.event_name == 'pull_request' && 'gh-releases-zsync|boggedbrush|PatchOpsIII|latest|PatchOpsIII.AppImage.zsync') || '' }}
      VT_ENABLED: ${{ secrets.VT_API_KEY != '' }}
      VT_CLI_ARCHIVE: vt-cli.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Build: GPUI (X11 + Wayland backends) and its font stack. Packaging: patchelf, squashfs, zsync.
          # Smoke test: Xvfb + tools, and Mesa's software Vulkan (lavapipe) because the runner has no GPU.
          sudo apt-get install -y \
            build-essential pkg-config \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shm0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev \
            patchelf squashfs-tools zsync imagemagick binutils unzip \
            x11-utils xdotool xvfb libvulkan1 mesa-vulkan-drivers python3
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-cargo-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-cargo-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Core unit tests
        run: cargo test --locked -p patchops-core
      - name: Clippy
        run: cargo clippy --locked -p patchops-core -p patchops --all-targets -- -D warnings
      - name: Parity suite (legacy goldens vs patchops-rpc)
        run: |
          cargo build --locked -p patchops-core --bin patchops-rpc
          python3 tools/parity.py --bin target/debug/patchops-rpc --quiet
      - name: Build release binary
        run: |
          cargo build --release --locked -p patchops
          ./target/release/patchops --version
      - name: Build AppImage
        run: packaging/linux/build-appimage.sh
      - name: Verify AppImage artifact
        run: |
          set -euo pipefail
          test -s "$ZSYNC_PATH"
          packaging/linux/verify-appimage.sh "$APPIMAGE_PATH" "$UPDATE_INFORMATION"
      - name: Install catalog Firejail test runtime
        run: |
          set -euo pipefail
          catalog_firejail="$RUNNER_TEMP/catalog-firejail"
          mkdir -p "$catalog_firejail"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimage.github.io/releases/download/deps/alpine-firejail-git20230825.tar.gz \
            --output "$catalog_firejail/firejail.tar.gz"
          echo "e346e52ac7dbff3a3f1e8aad3cbb2f06584afcb51c840de07cb8d50e134492d9  $catalog_firejail/firejail.tar.gz" | sha256sum --check
          curl --fail --location --retry 3 \
            https://dl-cdn.alpinelinux.org/alpine/v3.13/main/x86_64/musl-1.2.2-r2.apk \
            --output "$catalog_firejail/musl.apk"
          echo "3d459f4f3a83e60c6c260c6aee26745e7aa22697f53e3a01445227d2cfeeae8a  $catalog_firejail/musl.apk" | sha256sum --check
          tar -xzf "$catalog_firejail/firejail.tar.gz" -C "$catalog_firejail"
          tar --warning=no-unknown-keyword -xzf "$catalog_firejail/firejail-0_git20230825-r0.apk" -C "$catalog_firejail" etc/firejail usr/bin/firejail usr/lib/firejail
          tar --warning=no-unknown-keyword -xzf "$catalog_firejail/musl.apk" -C "$catalog_firejail" lib
          sudo cp -R "$catalog_firejail/lib/." /lib/
          sudo cp -R "$catalog_firejail/etc/firejail" /etc/
          sudo cp -R "$catalog_firejail/usr/lib/firejail" /usr/lib/
          sudo install -o root -g root -m 4755 "$catalog_firejail/usr/bin/firejail" /usr/bin/firejail
      - name: Smoke test AppImage at 800x600 with extraction and Firejail
        run: |
          set -euo pipefail
          for launch_mode in firejail extract; do
          export LAUNCH_MODE="$launch_mode"
          echo "Testing AppImage launch mode: $LAUNCH_MODE"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/patchops-config-$launch_mode"
          export XDG_CACHE_HOME="$RUNNER_TEMP/patchops-cache-$launch_mode"
          export XDG_DATA_HOME="$RUNNER_TEMP/patchops-data-$launch_mode"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME"
          xvfb-run --auto-servernum --server-args="-screen 0 800x600x24" bash -euo pipefail <<'SMOKE_TEST'
          screen_info="$(xwininfo -root)"
          grep -Eq "Width: +800" <<< "$screen_info"
          grep -Eq "Height: +600" <<< "$screen_info"

          if [ "$LAUNCH_MODE" = firejail ]; then
            setsid firejail --quiet --noprofile --net=none --appimage "$GITHUB_WORKSPACE/$APPIMAGE_PATH" &
          else
            APPIMAGE_EXTRACT_AND_RUN=1 setsid "$GITHUB_WORKSPACE/$APPIMAGE_PATH" &
          fi
          app_pid=$!
          cleanup() {
            if kill -0 "$app_pid" 2>/dev/null; then
              kill -- "-$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          window_id=""
          for _ in {1..30}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              if wait "$app_pid"; then status=0; else status=$?; fi
              echo "AppImage exited before opening its window (status $status)" >&2
              exit 1
            fi
            if window_id="$(xdotool search --onlyvisible --name "PatchOpsIII" 2>/dev/null | head -n 1)" && [ -n "$window_id" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$window_id" ]; then
            echo "PatchOpsIII window did not appear within 30 seconds" >&2
            exit 1
          fi

          # The window must fit the 800x600 display (GPUI clamps its default size to the work area).
          window_info="$(xwininfo -id "$window_id")"
          window_width="$(awk '/Width:/ { print $2; exit }' <<< "$window_info")"
          window_height="$(awk '/Height:/ { print $2; exit }' <<< "$window_info")"
          if (( window_width > 800 || window_height > 600 )); then
            echo "AppImage window exceeds the 800x600 display: ${window_width}x${window_height}" >&2
            exit 1
          fi

          sleep 10
          kill -0 "$app_pid"
          SMOKE_TEST
          done
      - name: Compute AppImage hash
        id: compute_hash
        run: |
          hash=$(sha256sum "$APPIMAGE_PATH" | cut -d ' ' -f1)
          printf "%s\n" "$hash" > "dist/packages/hash.log"
          vt_url="https://www.virustotal.com/gui/file/$hash"
          printf "hash=%s\n" "$hash" >> "$GITHUB_OUTPUT"
          printf "vt_url=%s\n" "$vt_url" >> "$GITHUB_OUTPUT"
      - name: Determine VirusTotal CLI release
        id: vt_release
        if: ${{ env.VT_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import os
          import urllib.request

          url = "https://api.github.com/repos/VirusTotal/vt-cli/releases/latest"
          with urllib.request.urlopen(url) as response:
              data = json.load(response)

          tag = data.get("tag_name")
          if not tag:
              raise SystemExit("Release tag missing from VirusTotal CLI metadata")

          try:
              asset_url = next(
                  asset["browser_download_url"]
                  for asset in data["assets"]
                  if asset["name"] == "Linux64.zip"
              )
          except StopIteration as exc:
              raise SystemExit("Linux64.zip asset not found in VirusTotal CLI release metadata") from exc

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag={tag}\n")
              handle.write(f"url={asset_url}\n")
          PY
      - name: Cache VirusTotal CLI
        id: cache-vt
        if: ${{ env.VT_ENABLED == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            vt
            ${{ env.VT_CLI_ARCHIVE }}
          key: vt-${{ runner.os }}-${{ steps.vt_release.outputs.tag }}
      - name: Download VirusTotal CLI
        if: ${{ env.VT_ENABLED == 'true' && steps.cache-vt.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          curl -sSL "${{ steps.vt_release.outputs.url }}" -o "$VT_CLI_ARCHIVE"
          unzip -q -o "$VT_CLI_ARCHIVE"
      - name: Ensure VirusTotal CLI executable
        if: ${{ env.VT_ENABLED == 'true' }}
        run: |
          if [ ! -f vt ]; then
            echo 'VirusTotal CLI binary not found' >&2
            exit 1
          fi
          chmod +x vt
      - name: VirusTotal scan
        if: ${{ env.VT_ENABLED == 'true' }}
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: ./vt scan file "$APPIMAGE_PATH" --apikey "$VT_API_KEY"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatchOpsIII-linux
          path: |
            dist/packages/PatchOpsIII.AppImage
            dist/packages/PatchOpsIII.AppImage.zsync
            dist/packages/hash.log
          if-no-files-found: error
