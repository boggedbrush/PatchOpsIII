name: Linux Build

on:
  push:
    branches:
      - Testing
      - testing
  pull_request:
    branches:
      - Testing
      - testing
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and scan
        required: false
        type: string
        default: ''
      update_information:
        description: AppImageUpdate metadata to embed in the AppImage
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ''
      update_information:
        description: AppImageUpdate metadata to embed in the AppImage
        required: false
        type: string
        default: ''
    outputs:
      hash:
        description: SHA256 hash of the AppImage
        value: ${{ jobs.build-linux.outputs.hash }}
      vt_url:
        description: VirusTotal URL for the AppImage
        value: ${{ jobs.build-linux.outputs.vt_url }}
      artifact_name:
        description: Name of the produced artifact
        value: ${{ jobs.build-linux.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux Electron AppImage
    runs-on: ubuntu-22.04
    outputs:
      hash: ${{ steps.compute_hash.outputs.hash }}
      vt_url: ${{ steps.compute_hash.outputs.vt_url }}
      artifact_name: PatchOpsIII-linux
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      BUN_VERSION: "1.3.13"
      ELECTRON_VERSION: "31.7.7"
      ELECTRON_BUILDER_VERSION: "26.8.1"
      PYTHON_VERSION: "3.12"
      APPIMAGE_PATH: dist/packages/PatchOpsIII.AppImage
      ZSYNC_PATH: dist/packages/PatchOpsIII.AppImage.zsync
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VT_ENABLED: ${{ secrets.VT_API_KEY != '' }}
      VT_CLI_ARCHIVE: vt-cli.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: linux-bun-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            linux-bun-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: linux-electron-${{ runner.arch }}-${{ env.ELECTRON_VERSION }}
          restore-keys: |
            linux-electron-${{ runner.arch }}-
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: linux-electron-builder-${{ runner.arch }}-${{ env.ELECTRON_BUILDER_VERSION }}-${{ env.ELECTRON_VERSION }}
          restore-keys: |
            linux-electron-builder-${{ runner.arch }}-${{ env.ELECTRON_BUILDER_VERSION }}-
            linux-electron-builder-${{ runner.arch }}-
      - name: Cache Python virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: linux-venv-${{ runner.arch }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            linux-venv-${{ runner.arch }}-${{ env.PYTHON_VERSION }}-
      - name: Install Linux packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils firejail imagemagick squashfs-tools unzip x11-utils xdotool xvfb zsync
      - name: Download appimagetool
        run: |
          set -euo pipefail
          appimagetool_path="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          runtime_path="$RUNNER_TEMP/runtime-x86_64"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$appimagetool_path"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $appimagetool_path" | sha256sum --check
          curl --fail --location --retry 3 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
            --output "$runtime_path"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $runtime_path" | sha256sum --check
          chmod +x "$appimagetool_path"
          echo "APPIMAGETOOL_PATH=$appimagetool_path" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME_PATH=$runtime_path" >> "$GITHUB_ENV"
      - name: Install Python backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -U pyinstaller
      - name: Install Electron dependencies
        run: bun install --frozen-lockfile
      - name: Build Electron AppImage
        run: bun run dist:linux
      - name: Repack AppImage with update support
        env:
          UPDATE_INFORMATION: ${{ inputs.update_information || (github.event_name == 'pull_request' && 'gh-releases-zsync|boggedbrush|PatchOpsIII|latest|PatchOpsIII.AppImage.zsync') || '' }}
        run: |
          set -euo pipefail
          if [ ! -f "$APPIMAGE_PATH" ]; then
            find dist -maxdepth 4 -type f -print
            echo "$APPIMAGE_PATH was not produced" >&2
            exit 1
          fi
          chmod +x "$APPIMAGE_PATH"
          appimage_name="$(basename "$APPIMAGE_PATH")"
          appimage_dir="$(dirname "$APPIMAGE_PATH")"
          (
            cd "$appimage_dir"
            "./$appimage_name" --appimage-extract
            chmod 755 squashfs-root
            mv "$appimage_name" "$appimage_name.electron-builder"
            if [ -n "$UPDATE_INFORMATION" ]; then
              ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGETOOL_PATH" \
                --runtime-file "$APPIMAGE_RUNTIME_PATH" \
                --updateinformation "$UPDATE_INFORMATION" squashfs-root "$appimage_name"
            else
              ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGETOOL_PATH" \
                --runtime-file "$APPIMAGE_RUNTIME_PATH" \
                squashfs-root "$appimage_name"
            fi
            rm -rf squashfs-root "$appimage_name.electron-builder"
            chmod +x "$appimage_name"
            if [ -z "$UPDATE_INFORMATION" ]; then
              zsyncmake -u "$appimage_name" -o "$appimage_name.zsync" "$appimage_name"
            fi
          )
      - name: Verify AppImage artifact
        env:
          UPDATE_INFORMATION: ${{ inputs.update_information || (github.event_name == 'pull_request' && 'gh-releases-zsync|boggedbrush|PatchOpsIII|latest|PatchOpsIII.AppImage.zsync') || '' }}
        run: |
          set -euo pipefail
          test -s "$APPIMAGE_PATH"
          test -s "$ZSYNC_PATH"
          if [ -n "$UPDATE_INFORMATION" ]; then
            actual_update_information="$("$APPIMAGE_PATH" --appimage-updateinformation)"
            if [ "$actual_update_information" != "$UPDATE_INFORMATION" ]; then
              printf 'Expected update information: %s\nFound: %s\n' \
                "$UPDATE_INFORMATION" "$actual_update_information" >&2
              exit 1
            fi
          fi
          squashfs_listing="$RUNNER_TEMP/appimage-filesystem.txt"
          unsquashfs -lln -o "$("$APPIMAGE_PATH" --appimage-offset)" "$APPIMAGE_PATH" > "$squashfs_listing"
          awk '$NF == "squashfs-root" { found = 1; if ($1 != "drwxr-xr-x") { print "AppImage root must have mode 0755: " $0 > "/dev/stderr"; exit 1 } } END { if (!found) exit 1 }' "$squashfs_listing"
          extraction_dir="$(mktemp -d)"
          (cd "$extraction_dir" && "$GITHUB_WORKSPACE/$APPIMAGE_PATH" --appimage-extract >/dev/null)
          test -x "$extraction_dir/squashfs-root/AppRun"
          rm -rf "$extraction_dir"
      - name: Smoke test AppImage at 800x600 with extraction and Firejail
        env:
          SCREENSHOT_PATH: ${{ runner.temp }}/PatchOpsIII-800x600.png
        run: |
          set -euo pipefail
          for launch_mode in extract firejail; do
          export LAUNCH_MODE="$launch_mode"
          echo "Testing AppImage launch mode: $LAUNCH_MODE"
          xvfb-run --auto-servernum --server-args="-screen 0 800x600x24" bash -euo pipefail <<'SMOKE_TEST'
          screen_info="$(xwininfo -root)"
          grep -Eq "Width: +800" <<< "$screen_info"
          grep -Eq "Height: +600" <<< "$screen_info"

          if [ "$LAUNCH_MODE" = firejail ]; then
            firejail --debug --noprofile --net=none --appimage "$GITHUB_WORKSPACE/$APPIMAGE_PATH" &
          else
            APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$APPIMAGE_PATH" --no-sandbox --disable-gpu &
          fi
          app_pid=$!
          cleanup() {
            if kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          window_id=""
          for _ in {1..30}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              if wait "$app_pid"; then status=0; else status=$?; fi
              echo "AppImage exited before opening its window (status $status)" >&2
              exit 1
            fi
            if window_id="$(xdotool search --onlyvisible --name "PatchOpsIII" 2>/dev/null | head -n 1)" && [ -n "$window_id" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$window_id" ]; then
            echo "PatchOpsIII window did not appear within 30 seconds" >&2
            exit 1
          fi

          window_info="$(xwininfo -id "$window_id")"
          window_x="$(awk '/Absolute upper-left X:/ { print $4; exit }' <<< "$window_info")"
          window_y="$(awk '/Absolute upper-left Y:/ { print $4; exit }' <<< "$window_info")"
          window_width="$(awk '/Width:/ { print $2; exit }' <<< "$window_info")"
          window_height="$(awk '/Height:/ { print $2; exit }' <<< "$window_info")"
          if (( window_x < 0 || window_y < 0 || window_x + window_width > 800 || window_y + window_height > 600 )); then
            echo "AppImage window exceeds the 800x600 display: ${window_width}x${window_height} at ${window_x},${window_y}" >&2
            exit 1
          fi

          sleep 2
          import -window root "$SCREENSHOT_PATH"
          test -s "$SCREENSHOT_PATH"
          sleep 20
          kill -0 "$app_pid"
          SMOKE_TEST
          done
      - name: Upload AppImage visual review screenshot
        uses: actions/upload-artifact@v4
        with:
          name: PatchOpsIII-AppImage-800x600
          path: ${{ runner.temp }}/PatchOpsIII-800x600.png
          if-no-files-found: error
      - name: Compute AppImage hash
        id: compute_hash
        run: |
          hash=$(sha256sum "$APPIMAGE_PATH" | cut -d ' ' -f1)
          printf "%s\n" "$hash" > "dist/packages/hash.log"
          vt_url="https://www.virustotal.com/gui/file/$hash"
          printf "hash=%s\n" "$hash" >> "$GITHUB_OUTPUT"
          printf "vt_url=%s\n" "$vt_url" >> "$GITHUB_OUTPUT"
      - name: Determine VirusTotal CLI release
        id: vt_release
        if: ${{ env.VT_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import os
          import urllib.request

          url = "https://api.github.com/repos/VirusTotal/vt-cli/releases/latest"
          with urllib.request.urlopen(url) as response:
              data = json.load(response)

          tag = data.get("tag_name")
          if not tag:
              raise SystemExit("Release tag missing from VirusTotal CLI metadata")

          try:
              asset_url = next(
                  asset["browser_download_url"]
                  for asset in data["assets"]
                  if asset["name"] == "Linux64.zip"
              )
          except StopIteration as exc:
              raise SystemExit("Linux64.zip asset not found in VirusTotal CLI release metadata") from exc

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag={tag}\n")
              handle.write(f"url={asset_url}\n")
          PY
      - name: Cache VirusTotal CLI
        id: cache-vt
        if: ${{ env.VT_ENABLED == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            vt
            ${{ env.VT_CLI_ARCHIVE }}
          key: vt-${{ runner.os }}-${{ steps.vt_release.outputs.tag }}
      - name: Download VirusTotal CLI
        if: ${{ env.VT_ENABLED == 'true' && steps.cache-vt.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          curl -sSL "${{ steps.vt_release.outputs.url }}" -o "$VT_CLI_ARCHIVE"
          unzip -q -o "$VT_CLI_ARCHIVE"
      - name: Ensure VirusTotal CLI executable
        if: ${{ env.VT_ENABLED == 'true' }}
        run: |
          if [ ! -f vt ]; then
            echo 'VirusTotal CLI binary not found' >&2
            exit 1
          fi
          chmod +x vt
      - name: VirusTotal scan
        if: ${{ env.VT_ENABLED == 'true' }}
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: ./vt scan file "$APPIMAGE_PATH" --apikey "$VT_API_KEY"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatchOpsIII-linux
          path: |
            dist/packages/PatchOpsIII.AppImage
            dist/packages/PatchOpsIII.AppImage.zsync
            dist/packages/hash.log
          if-no-files-found: error
