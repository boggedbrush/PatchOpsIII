name: Linux Build

on:
  push:
    branches: [main, Testing, testing]
  pull_request:
    branches: [main, Testing, testing]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and scan
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ""
    secrets:
      VT_API_KEY:
        description: Optional VirusTotal API key used only by the scan job
        required: false
    outputs:
      hash:
        description: SHA-256 hash of the AppImage (compatibility alias)
        value: ${{ jobs.build-linux.outputs.appimage_hash }}
      vt_url:
        description: VirusTotal URL for the AppImage (compatibility alias)
        value: ${{ jobs.build-linux.outputs.appimage_vt_url }}
      appimage_hash:
        description: SHA-256 hash of the AppImage
        value: ${{ jobs.build-linux.outputs.appimage_hash }}
      appimage_vt_url:
        description: VirusTotal URL for the AppImage
        value: ${{ jobs.build-linux.outputs.appimage_vt_url }}
      deb_hash:
        description: SHA-256 hash of the Debian package
        value: ${{ jobs.build-linux.outputs.deb_hash }}
      deb_vt_url:
        description: VirusTotal URL for the Debian package
        value: ${{ jobs.build-linux.outputs.deb_vt_url }}
      artifact_name:
        description: Name of the uploaded artifact
        value: ${{ jobs.build-linux.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build-linux:
    name: Test and build Tauri Linux packages
    runs-on: ubuntu-22.04
    outputs:
      appimage_hash: ${{ steps.hash.outputs.appimage_hash }}
      appimage_vt_url: ${{ steps.hash.outputs.appimage_vt_url }}
      deb_hash: ${{ steps.hash.outputs.deb_hash }}
      deb_vt_url: ${{ steps.hash.outputs.deb_vt_url }}
      artifact_name: PatchOpsIII-linux
    env:
      APPIMAGE_HASH_PATH: dist/packages/PatchOpsIII.AppImage.sha256
      APPIMAGE_PATH: dist/packages/PatchOpsIII.AppImage
      BUN_VERSION: "1.3.13"
      DEB_HASH_PATH: dist/packages/PatchOpsIII.deb.sha256
      DEB_PATH: dist/packages/PatchOpsIII.deb
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set reproducible source epoch
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxdo-dev \
            patchelf \
            unzip \
            wget \
            xdg-utils \
            xvfb

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks and tests
        run: |
          bun run verify
          scripts/linux-package-ci.sh self-test

      - name: Build AppImage and Debian package
        run: bun x tauri build --bundles appimage,deb

      - name: Canonicalize AppImage
        run: |
          set -euo pipefail
          mapfile -t packages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            printf 'Expected one AppImage, found %s\n' "${#packages[@]}" >&2
            find src-tauri/target/release/bundle -maxdepth 3 -type f -print >&2
            exit 1
          fi
          mkdir -p "$(dirname "$APPIMAGE_PATH")"
          install -m 0755 "${packages[0]}" "$APPIMAGE_PATH"

      - name: Canonicalize Debian package
        id: deb
        run: |
          set -euo pipefail
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            printf 'Expected one Debian package, found %s\n' "${#packages[@]}" >&2
            find src-tauri/target/release/bundle -maxdepth 3 -type f -print >&2
            exit 1
          fi
          upstream_version="$(node -p "require('./package.json').version")"
          scripts/linux-package-ci.sh canonicalize-deb "${packages[0]}" "$DEB_PATH" "$upstream_version"
          package="$(dpkg-deb --field "$DEB_PATH" Package)"
          version="$(dpkg-deb --field "$DEB_PATH" Version)"
          architecture="$(dpkg-deb --field "$DEB_PATH" Architecture)"
          [[ "$package" =~ ^[a-z0-9][a-z0-9+.-]+$ ]]
          [ "$architecture" = amd64 ]
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Smoke test AppImage on Ubuntu
        run: scripts/linux-package-ci.sh smoke-gui "$APPIMAGE_PATH" appimage-smoke.log

      - name: Compute Linux package hashes
        id: hash
        run: |
          set -euo pipefail
          appimage_hash="$(sha256sum "$APPIMAGE_PATH" | awk '{print $1}')"
          deb_hash="$(sha256sum "$DEB_PATH" | awk '{print $1}')"
          printf '%s  PatchOpsIII.AppImage\n' "$appimage_hash" > "$APPIMAGE_HASH_PATH"
          printf '%s  PatchOpsIII.deb\n' "$deb_hash" > "$DEB_HASH_PATH"
          printf 'appimage_hash=%s\n' "$appimage_hash" >> "$GITHUB_OUTPUT"
          printf 'appimage_vt_url=https://www.virustotal.com/gui/file/%s\n' "$appimage_hash" >> "$GITHUB_OUTPUT"
          printf 'deb_hash=%s\n' "$deb_hash" >> "$GITHUB_OUTPUT"
          printf 'deb_vt_url=https://www.virustotal.com/gui/file/%s\n' "$deb_hash" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PatchOpsIII-linux
          path: |
            dist/packages/PatchOpsIII.AppImage
            dist/packages/PatchOpsIII.AppImage.sha256
            dist/packages/PatchOpsIII.deb
            dist/packages/PatchOpsIII.deb.sha256
          if-no-files-found: error

  scan-linux:
    name: Submit immutable Linux artifacts to VirusTotal
    needs: build-linux
    runs-on: ubuntu-22.04
    env:
      VT_CLI_LINUX_SHA256: a340bcb2ee98aff6f19bde1de30702ddf106cbbc63b4309f60b33058e7689266
      VT_CLI_VERSION: "1.3.1"
      VT_ENABLED: ${{ secrets.VT_API_KEY != '' }}
    steps:
      - name: Download Linux artifacts
        if: ${{ env.VT_ENABLED == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-linux.outputs.artifact_name }}
          path: dist/packages

      - name: Verify Linux artifact integrity
        if: ${{ env.VT_ENABLED == 'true' }}
        env:
          EXPECTED_APPIMAGE_HASH: ${{ needs.build-linux.outputs.appimage_hash }}
          EXPECTED_DEB_HASH: ${{ needs.build-linux.outputs.deb_hash }}
        run: |
          set -euo pipefail
          cd dist/packages
          sha256sum -c PatchOpsIII.AppImage.sha256
          sha256sum -c PatchOpsIII.deb.sha256
          actual_appimage_hash="$(sha256sum PatchOpsIII.AppImage | awk '{print $1}')"
          actual_deb_hash="$(sha256sum PatchOpsIII.deb | awk '{print $1}')"
          [ "$actual_appimage_hash" = "$EXPECTED_APPIMAGE_HASH" ]
          [ "$actual_deb_hash" = "$EXPECTED_DEB_HASH" ]

      - name: Download VirusTotal CLI
        if: ${{ env.VT_ENABLED == 'true' }}
        run: |
          curl -fsSL "https://github.com/VirusTotal/vt-cli/releases/download/${VT_CLI_VERSION}/Linux64.zip" -o vt-cli.zip
          printf '%s  vt-cli.zip\n' "$VT_CLI_LINUX_SHA256" | sha256sum -c -
          unzip -q vt-cli.zip
          chmod +x vt

      - name: Submit AppImage to VirusTotal
        if: ${{ env.VT_ENABLED == 'true' }}
        env:
          VTCLI_APIKEY: ${{ secrets.VT_API_KEY }}
        run: ./vt scan file dist/packages/PatchOpsIII.AppImage

      - name: Submit Debian package to VirusTotal
        if: ${{ env.VT_ENABLED == 'true' }}
        env:
          VTCLI_APIKEY: ${{ secrets.VT_API_KEY }}
        run: ./vt scan file dist/packages/PatchOpsIII.deb

  smoke-appimage-ubuntu-clean:
    name: Smoke test AppImage without system GTK/WebKit on Ubuntu
    needs: build-linux
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install minimal GUI smoke dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            dbus-x11 \
            fontconfig \
            git \
            libegl1 \
            libfribidi0 \
            libgbm1 \
            libgl1 \
            libgles2 \
            libharfbuzz0b \
            libx11-dev \
            passwd \
            util-linux \
            xvfb

      - name: Verify system GTK and WebKit are absent
        run: |
          set -euo pipefail
          for package in libayatana-appindicator3-1 libgtk-3-0 libwebkit2gtk-4.1-0; do
            if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -Fqx 'install ok installed'; then
              printf 'Unexpected system GUI runtime package: %s\n' "$package" >&2
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-linux.outputs.artifact_name }}
          path: dist/packages

      - name: Verify AppImage startup and clean shutdown
        env:
          APPIMAGE_PATH: dist/packages/PatchOpsIII.AppImage
        run: |
          set -euo pipefail
          (cd "$(dirname "$APPIMAGE_PATH")" && sha256sum -c PatchOpsIII.AppImage.sha256)
          chmod +x "$APPIMAGE_PATH"
          install -d -m 1777 /tmp/.X11-unix
          useradd --create-home patchops-ci
          runuser -u patchops-ci -- env -u DISPLAY -u XAUTHORITY \
            HOME=/home/patchops-ci RUNNER_TEMP=/tmp \
            scripts/linux-package-ci.sh smoke-gui "$APPIMAGE_PATH" /tmp/ubuntu-clean-appimage-smoke.log

  smoke-deb-ubuntu:
    name: Install, upgrade, and purge Debian package on Ubuntu
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-linux.outputs.artifact_name }}
          path: dist/packages

      - name: Install GUI smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev xvfb

      - name: Verify Debian install and upgrade lifecycle
        env:
          DEB_PATH: dist/packages/PatchOpsIII.deb
          OLD_DEB_PATH: dist/smoke/PatchOpsIII-old.deb
        run: |
          set -euo pipefail
          (cd "$(dirname "$DEB_PATH")" && sha256sum -c PatchOpsIII.deb.sha256)
          scripts/linux-package-ci.sh make-older-deb "$DEB_PATH" "$OLD_DEB_PATH"

          package="$(dpkg-deb --field "$DEB_PATH" Package)"
          current_version="$(dpkg-deb --field "$DEB_PATH" Version)"
          old_version="$(dpkg-deb --field "$OLD_DEB_PATH" Version)"
          binary=""
          installed=0
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$installed" -eq 1 ]; then
              sudo apt-get purge -y "$package" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT

          sudo apt-get install -y "$(realpath "$OLD_DEB_PATH")"
          installed=1
          [ "$(dpkg-query -W -f='${Version}' "$package")" = "$old_version" ]

          mapfile -t binaries < <(dpkg -L "$package" | awk '/^\/usr\/bin\/[^/]+$/')
          mapfile -t desktop_entries < <(dpkg -L "$package" | awk '/^\/usr\/share\/applications\/[^/]+\.desktop$/')
          if [ "${#binaries[@]}" -ne 1 ] || [ "${#desktop_entries[@]}" -ne 1 ]; then
            printf 'Expected one executable and one desktop entry\n' >&2
            dpkg -L "$package" >&2
            exit 1
          fi
          binary="${binaries[0]}"
          desktop_entry="${desktop_entries[0]}"
          [ -x "$binary" ]
          [ -f "$desktop_entry" ]

          sentinel="$HOME/.local/share/PatchOpsIII/ci-package-smoke.txt"
          mkdir -p "$(dirname "$sentinel")"
          printf 'preserve user data\n' > "$sentinel"
          scripts/linux-package-ci.sh smoke-gui "$binary" deb-old-smoke.log

          sudo apt-get install -y "$(realpath "$DEB_PATH")"
          [ "$(dpkg-query -W -f='${Version}' "$package")" = "$current_version" ]
          [ -x "$binary" ]
          [ -f "$desktop_entry" ]
          scripts/linux-package-ci.sh smoke-gui "$binary" deb-smoke.log

          sudo apt-get purge -y "$package"
          installed=0
          if dpkg-query -W "$package" >/dev/null 2>&1; then
            printf 'Package remains installed after purge: %s\n' "$package" >&2
            exit 1
          fi
          [ ! -e "$binary" ]
          [ ! -e "$desktop_entry" ]
          [ -f "$sentinel" ]

  smoke-appimage-arch:
    name: Smoke test AppImage on Arch Linux
    needs: build-linux
    runs-on: ubuntu-22.04
    container:
      image: archlinux:base
    steps:
      - name: Install Arch smoke dependencies
        run: pacman -Syu --needed --noconfirm dbus fontconfig gcc git libx11 mesa shadow util-linux xorg-server-xvfb

      - name: Verify system GTK and WebKit are absent
        run: |
          set -euo pipefail
          for package in gtk3 libayatana-appindicator webkit2gtk-4.1; do
            if pacman -Q "$package" >/dev/null 2>&1; then
              printf 'Unexpected system GUI runtime package: %s\n' "$package" >&2
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-linux.outputs.artifact_name }}
          path: dist/packages

      - name: Verify AppImage startup and clean shutdown
        env:
          APPIMAGE_PATH: dist/packages/PatchOpsIII.AppImage
        run: |
          set -euo pipefail
          (cd "$(dirname "$APPIMAGE_PATH")" && sha256sum -c PatchOpsIII.AppImage.sha256)
          chmod +x "$APPIMAGE_PATH"
          install -d -m 1777 /tmp/.X11-unix
          useradd --create-home patchops-ci
          runuser -u patchops-ci -- env -u DISPLAY -u XAUTHORITY \
            HOME=/home/patchops-ci RUNNER_TEMP=/tmp \
            scripts/linux-package-ci.sh smoke-gui "$APPIMAGE_PATH" /tmp/arch-appimage-smoke.log
