name: Linux Build

on:
  push:
    branches: [main, Testing, testing]
  pull_request:
    branches: [main, Testing, testing]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and scan
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ""
    secrets:
      VT_API_KEY:
        description: Optional VirusTotal API key used only by the scan job
        required: false
    outputs:
      hash:
        description: SHA-256 hash of the AppImage (compatibility alias)
        value: ${{ jobs.build-linux.outputs.appimage_hash }}
      vt_url:
        description: VirusTotal URL for the AppImage (compatibility alias)
        value: ${{ jobs.build-linux.outputs.appimage_vt_url }}
      appimage_hash:
        description: SHA-256 hash of the AppImage
        value: ${{ jobs.build-linux.outputs.appimage_hash }}
      appimage_vt_url:
        description: VirusTotal URL for the AppImage
        value: ${{ jobs.build-linux.outputs.appimage_vt_url }}
      artifact_name:
        description: Name of the uploaded artifact
        value: ${{ jobs.build-linux.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build-linux:
    name: Build AppImage
    runs-on: ubuntu-22.04
    outputs:
      appimage_hash: ${{ steps.hash.outputs.appimage_hash }}
      appimage_vt_url: ${{ steps.hash.outputs.appimage_vt_url }}
      artifact_name: PatchOpsIII-linux
    env:
      APPIMAGE_HASH_PATH: dist/packages/PatchOpsIII.AppImage.sha256
      APPIMAGE_PATH: dist/packages/PatchOpsIII.AppImage
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set reproducible source epoch
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxdo-dev \
            patchelf \
            unzip \
            wget \
            xdg-utils \
            xvfb

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Build AppImage
        run: bun run dist:linux

      - name: Canonicalize AppImage
        run: |
          set -euo pipefail
          mapfile -t packages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            printf 'Expected one AppImage, found %s\n' "${#packages[@]}" >&2
            find src-tauri/target/release/bundle -maxdepth 3 -type f -print >&2
            exit 1
          fi
          mkdir -p "$(dirname "$APPIMAGE_PATH")"
          install -m 0755 "${packages[0]}" "$APPIMAGE_PATH"

      - name: Smoke test AppImage
        run: scripts/linux-package-ci.sh smoke-gui "$APPIMAGE_PATH" appimage-smoke.log

      - name: Compute AppImage hash
        id: hash
        run: |
          set -euo pipefail
          appimage_hash="$(sha256sum "$APPIMAGE_PATH" | awk '{print $1}')"
          printf '%s  PatchOpsIII.AppImage\n' "$appimage_hash" > "$APPIMAGE_HASH_PATH"
          printf 'appimage_hash=%s\n' "$appimage_hash" >> "$GITHUB_OUTPUT"
          printf 'appimage_vt_url=https://www.virustotal.com/gui/file/%s\n' "$appimage_hash" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PatchOpsIII-linux
          path: |
            dist/packages/PatchOpsIII.AppImage
            dist/packages/PatchOpsIII.AppImage.sha256
          if-no-files-found: error

  scan-linux:
    name: Scan AppImage
    needs: build-linux
    uses: ./.github/workflows/virustotal.yml
    with:
      artifact_name: ${{ needs.build-linux.outputs.artifact_name }}
      file_name: PatchOpsIII.AppImage
      expected_hash: ${{ needs.build-linux.outputs.appimage_hash }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}

  smoke-appimage-ubuntu-clean:
    name: Smoke test AppImage in clean environment
    needs: build-linux
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install minimal GUI smoke dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            dbus-x11 \
            fontconfig \
            git \
            libegl1 \
            libgbm1 \
            libgl1 \
            libgles2 \
            libx11-dev \
            passwd \
            util-linux \
            xvfb

      - name: Verify system GTK and WebKit are absent
        run: |
          set -euo pipefail
          for package in libayatana-appindicator3-1 libgtk-3-0 libwebkit2gtk-4.1-0; do
            if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -Fqx 'install ok installed'; then
              printf 'Unexpected system GUI runtime package: %s\n' "$package" >&2
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-linux.outputs.artifact_name }}
          path: dist/packages

      - name: Verify AppImage startup and clean shutdown
        env:
          APPIMAGE_PATH: dist/packages/PatchOpsIII.AppImage
        run: |
          set -euo pipefail
          (cd "$(dirname "$APPIMAGE_PATH")" && sha256sum -c PatchOpsIII.AppImage.sha256)
          chmod +x "$APPIMAGE_PATH"
          install -d -m 1777 /tmp/.X11-unix
          useradd --create-home patchops-ci
          runuser -u patchops-ci -- env -u DISPLAY -u XAUTHORITY \
            HOME=/home/patchops-ci RUNNER_TEMP=/tmp \
            scripts/linux-package-ci.sh smoke-gui "$APPIMAGE_PATH" /tmp/ubuntu-clean-appimage-smoke.log
